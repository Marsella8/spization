[project]
name = "spization"
version = "1.0.0"
description = "Package for Graph Series-Parallel-ization"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Marsella8", email = "pietromax.marsella@gmail.com" }]
dependencies = [
    "networkx>=3.3,<4",
    "multimethod>=1.12,<2",
    "loguru>=0.7.2,<1",
    "icecream>=2.1.3,<3",
    "numpy>=2.1.0,<3",
    "rich>=13.8.0,<14",
    "multiset>=3.2.0,<4",
    "bidict>=0.23.1,<1",
    "passagemath-graphs>=10.5.43,<11",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
    "pytest-xdist>=3.8.0,<4",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.6.3,<1",
    "ty>=0.0.1",
]

[project.scripts]
benchmark = "spization.benchmarking.benchmarking:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spization*"]
namespaces = true

[tool.ty.src]
include = ["spization"]

[tool.ruff]
lint.ignore = ["F811", "F821"]
lint.extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-n auto"
